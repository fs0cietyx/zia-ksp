name: 🚨 ZIA Catalyst CI/CD & Security Audit Pipeline

on:
  push:
    branches: [ "main", "staging", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit_and_test:
    name: 🛡️ Security Audit & Backend Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Install Serverless & ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov pandas numpy scikit-learn
          if [ -f functions/ksp_intelligence_api/requirements.txt ]; then
            pip install -r functions/ksp_intelligence_api/requirements.txt
          fi

      - name: 🔍 Syntax & AST Validation (flake8)
        run: |
          # Check for Python syntax errors or undefined names
          flake8 functions/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 🧪 Execute Backend Unit Test Harness
        run: |
          python -m pytest tests/ -v --cov=functions/ksp_intelligence_api

      - name: 📊 Audit SCRB Dataset Integrity
        run: |
          python3 -c "
          import pandas as pd
          df = pd.read_csv('functions/ksp_intelligence_api/Consolidated_Analytical_Master.csv')
          assert len(df) > 9000, 'Error: Dataset row count below minimum verification threshold (9,000)'
          assert 'latitude' in df.columns and 'longitude' in df.columns, 'Error: Spatial coordinate columns missing'
          print('✅ Verified SCRB FIR Records Ingested:', len(df))
          "

  frontend_asset_check:
    name: 🖥️ Client HUD Asset Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🟢 Verify HTML & JS File Integrity
        run: |
          test -f client/index.html || (echo "Missing index.html" && exit 1)
          test -f client/main.js || (echo "Missing main.js" && exit 1)
          test -f client/index.css || (echo "Missing index.css" && exit 1)
          echo "✅ Client HUD presentation assets verified successfully."
